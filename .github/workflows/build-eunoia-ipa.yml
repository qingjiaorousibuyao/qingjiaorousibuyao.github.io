name: Build Eunoia IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "EunoiaSwiftUI/**"
      - ".github/workflows/build-eunoia-ipa.yml"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: EunoiaSwiftUI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project Eunoia.xcodeproj \
            -scheme Eunoia \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Eunoia.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Eunoia-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Eunoia-unsigned-ipa
          path: EunoiaSwiftUI/Eunoia-unsigned.ipa
          if-no-files-found: error
