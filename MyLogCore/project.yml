name: MyLogCore
options:
  bundleIdPrefix: com.mylife
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  MyLogCore:
    type: application
    platform: iOS
    sources: [MyLogCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mylife.MyLogCore
        INFOPLIST_KEY_CFBundleDisplayName: MyLogCore
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 选择照片作为联系人头像、背景或发送图片消息。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: MyLogCore 需要使用麦克风来录制语音消息。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        GENERATE_INFOPLIST_FILE: true
