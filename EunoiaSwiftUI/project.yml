name: Eunoia
options:
  bundleIdPrefix: com.eunoia
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 0.1
    CURRENT_PROJECT_VERSION: 1
targets:
  Eunoia:
    type: application
    platform: iOS
    sources: [Eunoia]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eunoia.Eunoia
        INFOPLIST_KEY_CFBundleDisplayName: Eunoia
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 选择头像、联系人背景和聊天图片。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Eunoia 需要使用麦克风来录制语音消息。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        GENERATE_INFOPLIST_FILE: true
